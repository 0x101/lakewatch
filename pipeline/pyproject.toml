[project]
name = "lakewatch-pipeline"
version = "0.1.0"
description = "Satellite-powered lake-health tracking pipeline (Sentinel-2 via Google Earth Engine)"
requires-python = ">=3.12"
dependencies = [
    "shapely==2.1.2",
    "sqlalchemy==2.0.49",
    "psycopg2-binary==2.9.11",
    "earthengine-api==1.7.21",
    "python-dotenv==1.1.0",
    "numpy>=2.0",
    "matplotlib>=3.10",
    "rasterio>=1.5",
    "imageio>=2.37",
    "boto3>=1.42",
    "pygifsicle>=1.0",
    "requests>=2.31",
    "Pillow>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external services (Docker, GEE, etc.)",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["pipeline*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Tests often bind a result only to exercise a call path.
"tests/*" = ["F841"]
